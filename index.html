  <style>
html.central-guard-lock body{
  visibility:hidden!important;
}

#centralGuardLoading,
#centralGuardBlocked{
  position:fixed;
  inset:0;
  z-index:2147483647;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:linear-gradient(145deg,#667eea,#764ba2);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}

#centralGuardLoading{
  visibility:visible!important;
}

.central-guard-loading-box,
.central-guard-block-box{
  width:min(430px,100%);
  background:#fff;
  border-radius:26px;
  padding:24px 20px;
  text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
  color:#20283a;
}

.central-guard-spinner{
  width:42px;
  height:42px;
  margin:0 auto 14px;
  border:4px solid #e6e9f5;
  border-top-color:#667eea;
  border-radius:50%;
  animation:centralGuardSpin .8s linear infinite;
}

@keyframes centralGuardSpin{
  to{transform:rotate(360deg)}
}

.central-guard-loading-box b{
  display:block;
  font-size:18px;
}

.central-guard-loading-box small{
  display:block;
  margin-top:5px;
  color:#687187;
  font-size:10px;
}

.central-guard-block-box .central-guard-lock-icon{
  font-size:42px;
  margin-bottom:8px;
}

.central-guard-block-box h2{
  margin:0 0 8px;
  font-size:23px;
}

.central-guard-block-box p{
  margin:0;
  color:#687187;
  font-size:12px;
  line-height:1.55;
}

.central-guard-block-box button{
  width:100%;
  min-height:50px;
  margin-top:16px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#667eea,#5363dc);
  color:#fff;
  font-size:13px;
  font-weight:850;
}

.central-guard-block-box small{
  display:block;
  margin-top:10px;
  color:#a0a6b4;
  font-size:9px;
}
</style>

<script>
document.documentElement.classList.add("central-guard-lock");
</script>

  function calculator(root){root.innerHTML=`<div class="field"><input id="calcDisplay" class="calc-display" inputmode="decimal" placeholder="0"></div><div class="calc-grid">${['C','(',')','⌫','7','8','9','÷','4','5','6','×','1','2','3','−','0',',','%','+'].map(v=>`<button class="${'÷×−+'.includes(v)?'op':''}" data-calc="${v}">${v}</button>`).join('')}<button data-calc="=" class="eq" style="grid-column:span 4">=</button></div><div id="calcRes" class="result"><span>Resultado</span><strong>0</strong></div>`;

  function geometry(root){root.innerHTML=`<div class="field"><label>Forma</label><select id="gShape"><option value="circle">Círculo</option><option value="rect">Retângulo</option><option value="tri">Triângulo</option><option value="cube">Cubo</option><option value="sphere">Esfera</option></select></div><div class="form-grid"><div class="field"><label id="gL1">Raio</label><input id="g1" inputmode="decimal"></div><div class="field" id="g2wrap"><label id="gL2">Altura</label><input id="g2" inputmode="decimal"></div></div><button class="primary" id="gGo">Calcular</button><div id="gRes" class="result">Informe as medidas.</div>`;const update=()=>{const s=$('#gShape',root).value,l1=$('#gL1',root),l2=$('#gL2',root),w=$('#g2wrap',root);if(s==='circle'){l1.textContent='Raio';w.classList.add('hidden')}else if(s==='rect'){l1.textContent='Largura';l2.textContent='Altura';w.classList.remove('hidden')}else if(s==='tri'){l1.textContent='Base';l2.textContent='Altura';w.classList.remove('hidden')}else if(s==='cube'){l1.textContent='Aresta';w.classList.add('hidden')}else{l1.textContent='Raio';w.classList.add('hidden')}};$('#gShape',root).onchange=update;update();$('#gGo',root).onclick=()=>{const s=$('#gShape',root).value,a=number($('#g1',root).value),b=number($('#g2',root).value);if(!Number.isFinite(a))return;let html='';if(s==='circle')html=`Área: <b>${fmt(Math.PI*a*a)}</b><br>Perímetro: <b>${fmt(2*Math.PI*a)}</b>`;if(s==='rect')html=`Área: <b>${fmt(a*b)}</b><br>Perímetro: <b>${fmt(2*(a+b))}</b>`;if(s==='tri')html=`Área: <b>${fmt(a*b/2)}</b>`;if(s==='cube')html=`Área total: <b>${fmt(6*a*a)}</b><br>Volume: <b>${fmt(a**3)}</b>`;if(s==='sphere')html=`Área: <b>${fmt(4*Math.PI*a*a)}</b><br>Volume: <b>${fmt(4/3*Math.PI*a**3)}</b>`;result($('#gRes',root),html)}; }

  function converter(root){root.innerHTML=`<div class="field"><label>Categoria</label><select id="cCat">${Object.entries(unitSets).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></div><div class="form-grid"><div class="field"><label>Valor</label><input id="cVal" inputmode="decimal"></div><div class="field"><label>De</label><select id="cFrom"></select></div><div class="field"><label>Para</label><select id="cTo"></select></div></div><button class="primary" id="cGo">Converter</button><div id="cRes" class="result">Escolha as unidades.</div>`;const upd=()=>{const set=unitSets[$('#cCat',root).value],opts=Object.keys(set.units).map(u=>`<option>${u}</option>`).join('');$('#cFrom',root).innerHTML=opts;$('#cTo',root).innerHTML=opts;$('#cTo',root).selectedIndex=Math.min(1,Object.keys(set.units).length-1)};$('#cCat',root).onchange=upd;upd();$('#cGo',root).onclick=()=>{let v=number($('#cVal',root).value),cat=$('#cCat',root).value,f=$('#cFrom',root).value,t=$('#cTo',root).value;if(!Number.isFinite(v))return;let out;if(cat==='temp'){const toC=(x,u)=>u==='°C'?x:u==='°F'?(x-32)*5/9:x-273.15;const fromC=(x,u)=>u==='°C'?x:u==='°F'?x*9/5+32:x+273.15;out=fromC(toC(v,f),t)}else out=v*unitSets[cat].units[f]/unitSets[cat].units[t];result($('#cRes',root),`<span>${fmt(v)} ${f} =</span><strong>${fmt(out)} ${t}</strong>`)}; }

  function image(root){root.innerHTML=`<div class="field"><label>Escolher imagens</label><input id="imgFile" type="file" accept="image/*" multiple></div><div class="form-grid"><div class="field"><label>Largura</label><input id="imgW" type="number"></div><div class="field"><label>Altura</label><input id="imgH" type="number"></div><div class="field"><label>Formato</label><select id="imgType"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div><div class="field"><label>Qualidade <span id="imgQLabel">85%</span></label><input id="imgQ" type="range" min="20" max="100" value="85"></div></div><label class="check"><input id="imgRatio" type="checkbox" checked> Manter proporção</label><div class="chips" style="margin:12px 0"><button class="chip" data-size="50">50%</button><button class="chip" data-preset="192">192×192</button><button class="chip" data-preset="512">512×512</button><button class="chip" data-preset="1080">1080×1080</button></div><div id="imgCompare" class="compare-grid hidden"><div class="compare-box"><img id="imgPrev"><small id="imgOriginalInfo">Original</small></div><div class="compare-box"><img id="imgAfter"><small id="imgAfterInfo">Prévia processada</small></div></div><div class="action-row"><button class="primary" id="imgProcess">Processar imagens</button><button class="secondary" id="imgUndo">↩ Desfazer ajuste</button></div><div id="imgInfo" class="result">Escolha uma ou várias imagens.</div><div id="batchResults" class="batch-results"></div>`;let files=[],images=[],ratio=1,history=[],processed=[];const snapshot=()=>history.push({w:$('#imgW',root).value,h:$('#imgH',root).value,type:$('#imgType',root).value,q:$('#imgQ',root).value});$('#imgQ',root).oninput=()=>$('#imgQLabel',root).textContent=$('#imgQ',root).value+'%';$('#imgFile',root).onchange=async()=>{files=[...$('#imgFile',root).files];if(!files.length)return;images=await Promise.all(files.map(readImage));ratio=images[0].width/images[0].height;$('#imgW',root).value=images[0].width;$('#imgH',root).value=images[0].height;$('#imgPrev',root).src=images[0].src;$('#imgCompare',root).classList.remove('hidden');$('#imgAfter',root).src=images[0].src;const total=files.reduce((a,f)=>a+f.size,0);$('#imgOriginalInfo',root).textContent=`${images[0].width}×${images[0].height} • ${(files[0].size/1024).toFixed(1)} KB`;result($('#imgInfo',root),`${files.length} arquivo(s) • ${(total/1024).toFixed(1)} KB no total`,false,{noActions:true})};$('#imgW',root).oninput=()=>{if(images[0]&&$('#imgRatio',root).checked)$('#imgH',root).value=Math.round(number($('#imgW',root).value)/ratio)};$('#imgH',root).oninput=()=>{if(images[0]&&$('#imgRatio',root).checked)$('#imgW',root).value=Math.round(number($('#imgH',root).value)*ratio)};$$('[data-size]',root).forEach(b=>b.onclick=()=>{if(!images[0])return;snapshot();const p=+b.dataset.size/100;$('#imgW',root).value=Math.round(images[0].width*p);$('#imgH',root).value=Math.round(images[0].height*p)});$$('[data-preset]',root).forEach(b=>b.onclick=()=>{snapshot();$('#imgW',root).value=$('#imgH',root).value=b.dataset.preset});$('#imgUndo',root).onclick=()=>{const x=history.pop();if(!x)return;$('#imgW',root).value=x.w;$('#imgH',root).value=x.h;$('#imgType',root).value=x.type;$('#imgQ',root).value=x.q;$('#imgQ',root).dispatchEvent(new Event('input'))};$('#imgProcess',root).onclick=async()=>{if(!images.length)return toast('Escolha uma imagem.');processed.forEach(x=>URL.revokeObjectURL(x.url));processed=[];const type=$('#imgType',root).value,q=+$('#imgQ',root).value/100,targetW=Math.max(1,Math.floor(number($('#imgW',root).value))),targetH=Math.max(1,Math.floor(number($('#imgH',root).value)));for(let i=0;i<images.length;i++){let w=targetW,h=targetH;if(images.length>1&&$('#imgRatio',root).checked){const r=images[i].width/images[i].height;if(targetW&&targetH){w=targetW;h=Math.round(w/r)}}const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');if(type==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h)}ctx.drawImage(images[i],0,0,w,h);const blob=await canvasBlob(c,type,q),url=URL.createObjectURL(blob),ext=type==='image/jpeg'?'jpg':type==='image/png'?'png':'webp',name=`${files[i].name.replace(/\.[^.]+$/,'')}-${w}x${h}.${ext}`,saving=Math.max(0,Math.round((1-blob.size/files[i].size)*100));processed.push({blob,url,name,old:files[i].size,w,h,saving});if(i===0){$('#imgAfter',root).src=url;$('#imgAfterInfo',root).textContent=`${w}×${h} • ${(blob.size/1024).toFixed(1)} KB • ${saving}% menor`}}$('#batchResults',root).innerHTML=processed.map((x,i)=>`<div class="batch-item"><div><b>${escapeHtml(x.name)}</b><small>${(x.old/1024).toFixed(1)} KB → ${(x.blob.size/1024).toFixed(1)} KB • economia ${x.saving}%</small></div><button data-saveimg="${i}">Salvar</button></div>`).join('');$$('[data-saveimg]',root).forEach(b=>b.onclick=()=>{const x=processed[+b.dataset.saveimg];downloadBlob(x.blob,x.name)});result($('#imgInfo',root),`<span>Processamento concluído</span><strong>${processed.length} imagem(ns)</strong><br>Use “Salvar” em cada arquivo.`,false)};cleanupTool=()=>{processed.forEach(x=>URL.revokeObjectURL(x.url));images.forEach(x=>x.src?.startsWith('blob:')&&URL.revokeObjectURL(x.src))}}
  function pwaicon(root){root.innerHTML=`<div class="field"><label>Imagem do ícone</label><input id="piFile" type="file" accept="image/*"></div><img id="piPrev" class="image-preview hidden" style="max-height:230px"><div class="divider"></div><div class="section-title"><h3 style="font-size:19px">Presets prontos</h3></div><div class="action-row"><button class="primary" id="pi512">icone.png 512×512</button><button class="secondary" id="pi192">192×192</button><button class="secondary" id="piMask">Maskable 512×512</button><button class="secondary" id="piFav">Favicon 64×64</button></div><div id="piInfo" class="result"><b>Dica</b><br>O preset Maskable mantém uma área segura maior para o símbolo não ser cortado pelo Android.</div>`;let img=null;$('#piFile',root).onchange=async()=>{if(!$('#piFile',root).files[0])return;img=await readImage($('#piFile',root).files[0]);$('#piPrev',root).src=img.src;$('#piPrev',root).classList.remove('hidden')};const make=async(s,mask=false,name='icone.png')=>{if(!img)return toast('Escolha uma imagem.');const c=document.createElement('canvas');c.width=c.height=s;const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,s,s);const safe=mask?.78:1,scale=Math.min(s*safe/img.width,s*safe/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(s-w)/2,(s-h)/2,w,h);const blob=await canvasBlob(c,'image/png',1);downloadBlob(blob,name);result($('#piInfo',root),`<span>Ícone gerado</span><strong>${s} × ${s}px</strong><br>${mask?'Área segura Maskable aplicada.':'PNG pronto para uso.'}`,false)};$('#pi512',root).onclick=()=>make(512,false,'icone.png');$('#pi192',root).onclick=()=>make(192,false,'icone-192.png');$('#piMask',root).onclick=()=>make(512,true,'icone-maskable.png');$('#piFav',root).onclick=()=>make(64,false,'favicon.png')}


  /* Área Protegida — dados criptografados com AES-GCM e chave derivada do PIN */
  const enc=new TextEncoder(),dec=new TextDecoder();
  const bytesB64=bytes=>{let s='';new Uint8Array(bytes).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
  const b64Bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function deriveVaultKey(pin,salt){const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:180000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
  async function saveVault(){const old=store.get('vault',null);if(!vaultKey||!old)return;const iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},vaultKey,enc.encode(JSON.stringify(vaultItems)));store.set('vault',{v:1,salt:old.salt,iv:bytesB64(iv),data:bytesB64(cipher),updatedAt:new Date().toISOString()})}
  async function createVault(pin){const salt=crypto.getRandomValues(new Uint8Array(16));vaultKey=await deriveVaultKey(pin,salt);vaultItems=[];store.set('vault',{v:1,salt:bytesB64(salt),iv:'',data:''});await saveVault()}
  async function unlockVault(pin){const v=store.get('vault',null);if(!v)throw new Error('missing');const key=await deriveVaultKey(pin,b64Bytes(v.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64Bytes(v.iv)},key,b64Bytes(v.data));vaultKey=key;vaultItems=JSON.parse(dec.decode(plain));return true}
  async function changeVaultPin(pin){const salt=crypto.getRandomValues(new Uint8Array(16));vaultKey=await deriveVaultKey(pin,salt);store.set('vault',{v:1,salt:bytesB64(salt),iv:'',data:''});await saveVault()}
  async function addVaultItem(item){vaultItems.unshift({id:uid(),at:Date.now(),...item});await saveVault();toast('Salvo na Área Protegida.')}
  function openVaultForSave(item){pendingVaultItem=item;openTool('vault')}
  function vaultValue(item){if(item.type==='password')return item.data.value||'';if(item.type==='wifi')return `${item.data.ssid||''} | ${item.data.password||''}`;if(item.type==='pix')return `${item.data.key||''} | ${item.data.name||''} | ${item.data.city||''}`;return JSON.stringify(item.data)}
  function vaultTool(root){
    const blob=store.get('vault',null);if(!blob){root.innerHTML=`<div class="vault-lock">🛡️</div><div class="result">Crie um PIN para proteger senhas, redes Wi-Fi e dados Pix. O conteúdo será criptografado no aparelho.</div><div class="field"><label>Novo PIN (4 a 12 números)</label><input id="vPin" type="password" inputmode="numeric" maxlength="12"></div><div class="field"><label>Confirmar PIN</label><input id="vPin2" type="password" inputmode="numeric" maxlength="12"></div><button class="primary" id="vCreate" style="width:100%">Criar Área Protegida</button>`;$('#vCreate',root).onclick=async()=>{const a=$('#vPin',root).value,b=$('#vPin2',root).value;if(!/^\d{4,12}$/.test(a))return toast('Use de 4 a 12 números.');if(a!==b)return toast('Os PINs não coincidem.');await createVault(a);toast('Área Protegida criada.');if(pendingVaultItem){await addVaultItem(pendingVaultItem);pendingVaultItem=null}vaultTool(root)};return}
    if(!vaultKey){root.innerHTML=`<div class="vault-lock">🔒</div><div class="field"><label>PIN</label><input id="vUnlockPin" type="password" inputmode="numeric" maxlength="12" autofocus></div><button class="primary" id="vUnlock" style="width:100%">Desbloquear</button><p class="note">O PIN não é salvo. Sem ele, o conteúdo criptografado não pode ser aberto.</p>${pendingVaultItem?'<div class="result">Há um item esperando para ser salvo. Desbloqueie para continuar.</div>':''}`;const go=async()=>{try{await unlockVault($('#vUnlockPin',root).value);if(pendingVaultItem){await addVaultItem(pendingVaultItem);pendingVaultItem=null}vaultTool(root)}catch{toast('PIN incorreto.')}};$('#vUnlock',root).onclick=go;$('#vUnlockPin',root).onkeydown=e=>{if(e.key==='Enter')go()};return}
    const icons={password:'🔐',wifi:'📶',pix:'💠'};root.innerHTML=`<div class="action-row"><button class="secondary" id="vLock">🔒 Bloquear</button><button class="secondary" id="vChange">Alterar PIN</button></div><div class="vault-list">${vaultItems.length?vaultItems.map(x=>`<div class="vault-item"><div class="vault-item-head"><span>${icons[x.type]||'🛡️'}</span><b>${escapeHtml(x.label||x.type)}</b></div><small>${new Date(x.at).toLocaleString('pt-BR')}</small><div class="vault-value" data-vvalue="${x.id}" data-hidden="1">••••••••••••</div><div class="action-row"><button class="secondary" data-veye="${x.id}">👁️ Mostrar</button><button class="secondary" data-vcopy="${x.id}">Copiar</button><button class="danger" data-vdel="${x.id}">Excluir</button></div></div>`).join(''):'<div class="empty-note"><b>Nenhum item salvo.</b>Use “Salvar protegido” no Gerador de Senhas, QR Wi-Fi ou QR Pix.</div>'}</div>`;$('#vLock',root).onclick=()=>{vaultKey=null;vaultItems=[];vaultTool(root)};$('#vChange',root).onclick=async()=>{const p=prompt('Digite o novo PIN (4 a 12 números):');if(!p)return;if(!/^\d{4,12}$/.test(p))return toast('PIN inválido.');const c=prompt('Confirme o novo PIN:');if(p!==c)return toast('Os PINs não coincidem.');await changeVaultPin(p);toast('PIN alterado.')};$$('[data-veye]',root).forEach(b=>b.onclick=()=>{const x=vaultItems.find(i=>i.id===b.dataset.veye),el=$(`[data-vvalue="${b.dataset.veye}"]`,root),hide=el.dataset.hidden==='0';el.dataset.hidden=hide?'1':'0';el.textContent=hide?'••••••••••••':vaultValue(x);b.textContent=hide?'👁️ Mostrar':'🙈 Ocultar'});$$('[data-vcopy]',root).forEach(b=>b.onclick=()=>{const x=vaultItems.find(i=>i.id===b.dataset.vcopy);copyText(vaultValue(x))});$$('[data-vdel]',root).forEach(b=>b.onclick=async()=>{vaultItems=vaultItems.filter(i=>i.id!==b.dataset.vdel);await saveVault();vaultTool(root)})
  }

  /* Temporizador persistente dentro do app */
  function getActiveTimer(){return store.get('activeTimer',null)}
  function setActiveTimer(v){if(v)store.set('activeTimer',v);else localStorage.removeItem('toolbox.activeTimer');refreshActiveTimerBar()}
  function formatSeconds(s){s=Math.max(0,Math.ceil(s||0));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
  function startGlobalTimer(seconds,label='Temporizador'){setActiveTimer({label,duration:seconds,remaining:seconds,end:Date.now()+seconds*1000,state:'running',notified:false});tickGlobalTimer()}
  function pauseGlobalTimer(){const a=getActiveTimer();if(!a||a.state!=='running')return;a.remaining=Math.max(0,Math.ceil((a.end-Date.now())/1000));a.state='paused';setActiveTimer(a)}
  function resumeGlobalTimer(){const a=getActiveTimer();if(!a||a.state!=='paused')return;a.end=Date.now()+a.remaining*1000;a.state='running';setActiveTimer(a)}
  function cancelGlobalTimer(show=true){setActiveTimer(null);if(show)toast('Temporizador cancelado.')}
  async function timerNotify(){toast('Tempo encerrado!');haptic([180,100,180]);if(prefs.notifications&&'Notification'in window&&Notification.permission==='granted'){try{const r=await navigator.serviceWorker?.getRegistration();if(r)await r.showNotification('Tempo encerrado! ⏲️',{body:'O temporizador da Caixa de Ferramentas chegou a zero.',icon:'./icone.png',badge:'./icone.png',tag:'toolbox-timer',renotify:true});else new Notification('Tempo encerrado! ⏲️')}catch{}}}
  function tickGlobalTimer(){const a=getActiveTimer();if(!a)return refreshActiveTimerBar();if(a.state==='running'){const rem=Math.max(0,Math.ceil((a.end-Date.now())/1000));if(rem<=0){if(!a.notified){a.notified=true;store.set('activeTimer',a);timerNotify()}setTimeout(()=>setActiveTimer(null),1200)}}refreshActiveTimerBar()}
  function refreshActiveTimerBar(){const bar=$('#activeTimerBar'),a=getActiveTimer();if(!bar)return;if(!a){bar.classList.add('hidden');return}bar.classList.remove('hidden');$('#globalTimerLabel').textContent=a.label||'Temporizador';const rem=a.state==='running'?Math.max(0,Math.ceil((a.end-Date.now())/1000)):a.remaining;$('#globalTimerText').textContent=(a.state==='paused'?'Pausado • ':'')+formatSeconds(rem);$('#globalTimerPause').textContent=a.state==='running'?'⏸':'▶'}
  $('#timerOpen').onclick=()=>openTool('timer');$('#globalTimerPause').onclick=()=>{const a=getActiveTimer();if(!a)return;a.state==='running'?pauseGlobalTimer():resumeGlobalTimer()};$('#globalTimerCancel').onclick=()=>cancelGlobalTimer();setInterval(tickGlobalTimer,500);window.addEventListener('focus',tickGlobalTimer);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tickGlobalTimer()});
  function networkUpdate(){const b=$('#networkBadge');if(!b)return;b.classList.toggle('hidden',navigator.onLine)}window.addEventListener('online',networkUpdate);window.addEventListener('offline',networkUpdate);networkUpdate();

  render();
  const launchTool=new URLSearchParams(location.search).get('tool');if(launchTool&&tools.some(t=>t.id===launchTool))setTimeout(()=>openTool(launchTool),80);
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
})();
